    const { useState, useEffect, useRef } = React;

    // --- INTERACTIVE ANTIGRAVITY ENGINE (HTML5 CANVAS Particle Flow) ---
    const AntigravityCanvas = ({ isDarkMode }) => {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        const container = containerRef.current;
        if (!canvas || !container) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let isVisible = true;

        let canvasWidth = 800;
        let canvasHeight = 300;

        const particleCount = 110;
        const particles = [];
        const colors = isDarkMode 
          ? ['rgba(255, 255, 255, 0.6)', 'rgba(210, 210, 210, 0.45)', 'rgba(160, 160, 160, 0.35)', 'rgba(255, 255, 255, 0.3)', 'rgba(120, 120, 120, 0.25)']
          : ['rgba(30, 30, 30, 0.4)', 'rgba(60, 60, 60, 0.4)', 'rgba(100, 100, 100, 0.3)', 'rgba(0, 0, 0, 0.4)', 'rgba(140, 140, 140, 0.3)'];

        const initParticles = (width, height) => {
          particles.length = 0;
          const centerX = width / 2;
          const centerY = height / 2;

          for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 120 + 10;
            particles.push({
              x: centerX + Math.cos(angle) * distance,
              y: centerY + Math.sin(angle) * distance,
              vx: Math.cos(angle) * (Math.random() * 0.7 + 0.1),
              vy: Math.sin(angle) * (Math.random() * 0.7 + 0.1) - (Math.random() * 0.3 + 0.1),
              radius: Math.random() * 2 + 1,
              color: colors[Math.floor(Math.random() * colors.length)],
              opacity: Math.random() * 0.4 + 0.3,
              life: Math.random() * 150 + 100,
              originalLife: 250
            });
          }
        };

        const resizeObserver = new ResizeObserver((entries) => {
          for (let entry of entries) {
            const { width, height } = entry.contentRect;
            const w = width || 800;
            const h = height || 300;
            
            canvasWidth = w;
            canvasHeight = h;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (particles.length === 0) {
              initParticles(w, h);
            }
          }
        });

        resizeObserver.observe(container);

        const intersectionObserver = new IntersectionObserver(([entry]) => {
          isVisible = entry.isIntersecting;
          if (isVisible && !animationFrameId) {
            animate();
          }
        }, { threshold: 0.05 });
        intersectionObserver.observe(container);

        let mouse = { x: null, y: null, radius: 110 };

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.clientX - rect.left;
          mouse.y = e.clientY - rect.top;
        };

        const handleMouseLeave = () => {
          mouse.x = null;
          mouse.y = null;
        };

        container.addEventListener('mousemove', handleMouseMove);
        container.addEventListener('mouseleave', handleMouseLeave);

        const animate = () => {
          if (!isVisible) {
            animationFrameId = null;
            return;
          }

          ctx.clearRect(0, 0, canvasWidth, canvasHeight);

          // Deep monochromatic radial glow
          const gradient = ctx.createRadialGradient(
            canvasWidth / 2, canvasHeight / 2, 30,
            canvasWidth / 2, canvasHeight / 2, canvasWidth / 1.4
          );
          if (isDarkMode) {
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.04)');
            gradient.addColorStop(0.5, 'rgba(100, 100, 100, 0.015)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
          } else {
            gradient.addColorStop(0, 'rgba(30, 30, 30, 0.03)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
          }
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            p.x += p.vx;
            p.y += p.vy;
            p.vx += Math.sin(p.y * 0.02) * 0.005;

            if (mouse.x !== null && mouse.y !== null) {
              const dx = p.x - mouse.x;
              const dy = p.y - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const force = (mouse.radius - dist) / mouse.radius;
                const angle = Math.atan2(dy, dx);
                p.x += Math.cos(angle) * force * 3;
                p.y += Math.sin(angle) * force * 3;
              }
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity * (p.life / p.originalLife);
            ctx.fill();

            p.life--;

            if (p.life <= 0 || p.y < -15 || p.x < -15 || p.x > canvasWidth + 15 || p.y > canvasHeight + 15) {
              const angle = Math.random() * Math.PI * 2;
              const dist = Math.random() * 50 + 5;
              p.x = (canvasWidth / 2) + Math.cos(angle) * dist;
              p.y = (canvasHeight / 2) + Math.sin(angle) * dist + 30;
              p.vx = Math.cos(angle) * (Math.random() * 0.5 + 0.1);
              p.vy = Math.sin(angle) * (Math.random() * 0.5 + 0.1) - (Math.random() * 0.4 + 0.1);
              p.life = Math.random() * 150 + 100;
              p.opacity = Math.random() * 0.4 + 0.3;
            }
          }

          ctx.globalAlpha = 1.0;
          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          resizeObserver.disconnect();
          intersectionObserver.disconnect();
          container.removeEventListener('mousemove', handleMouseMove);
          container.removeEventListener('mouseleave', handleMouseLeave);
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [isDarkMode]);

      return (
        <div ref={containerRef} className="absolute inset-0 w-full h-full z-0 overflow-hidden">
          <canvas ref={canvasRef} className="block w-full h-full" />
        </div>
      );
    };

            <div className="space-y-6">
              
              {/* TECHNICAL STACKS CARD */}
              <div className="p-6 rounded-2xl border bg-zinc-950/70 border-zinc-800/80 shadow-xl backdrop-blur-sm">
                <h3 className="font-bold text-sm uppercase tracking-wider text-zinc-400 mb-4 pb-2 border-b border-zinc-800/80">
                  Technical Skill Matrix
                </h3>

                <div className="flex flex-wrap gap-2">
                  {technicalSkills.map((skill, index) => {
                    const isMatch = matchesSearch(skill.name);
                    return (
                      <span
                        key={index}
                        className={`px-3 py-1.5 rounded-lg text-xs font-mono font-medium border transition-all duration-300 ${
                          isMatch 
                            ? 'bg-zinc-900 border-zinc-700 text-zinc-100 hover:border-zinc-500' 
                            : 'opacity-20'
                        }`}
                      >
                        {skill.name}
                      </span>
                    );
                  })}
                </div>

                <div className="mt-6 pt-4 border-t border-zinc-800/80 text-[11px] text-zinc-400">
                  Languages: <strong className="text-zinc-200">English, Malayalam, Hindi</strong>
                </div>
              </div>

              {/* DIAGNOSTICS & PING CENTER */}
              <div className="p-6 rounded-2xl border bg-zinc-950/70 border-zinc-800/80 shadow-xl backdrop-blur-sm">
                <h3 className="font-bold text-sm uppercase tracking-wider text-zinc-400 mb-4 pb-2 border-b border-zinc-800/80">
                  Latency Diagnostics
                </h3>
                
                <p className="text-xs text-zinc-400 mb-4 leading-relaxed">
                  Verify local gateway packet configurations directly through simulated system diagnostics.
                </p>

                <button
                  onClick={runPingDiag}
                  disabled={isPinging}
                  className={`w-full py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition-all border ${
                    isPinging 
                      ? 'bg-zinc-900 text-zinc-500 border-zinc-800 cursor-not-allowed' 
                      : 'bg-white text-black hover:bg-zinc-200 border-white'
                  }`}
                >
                  {isPinging ? 'Pinging Node...' : 'Ping Amal VA'}
                </button>

                {pingResult && (
                  <pre className="mt-4 p-4 rounded-xl bg-black text-emerald-400 border border-zinc-800 font-mono text-[10px] leading-relaxed overflow-x-auto whitespace-pre-wrap max-h-32">
                    {pingResult}
                  </pre>
                )}
              </div>

              {/* CONTACT GATEWAY */}
              <div className="p-6 rounded-2xl border bg-zinc-950/70 border-zinc-800/80 shadow-xl backdrop-blur-sm">
                <h3 className="font-bold text-sm uppercase tracking-wider text-zinc-400 mb-4 pb-2 border-b border-zinc-800/80">
                  Establish Handshake
                </h3>

                <form onSubmit={handleContactSubmit} className="space-y-4">
                  <div className="space-y-3">
                    <div>
                      <label className="block text-[10px] uppercase font-bold tracking-wider text-zinc-400 font-mono mb-1">Your Name</label>
                      <input
                        type="text"
                        required
                        value={formInput.name}
                        onChange={(e) => setFormInput({ ...formInput, name: e.target.value })}
                        placeholder="John Doe"
                        className="w-full px-3 py-2 text-xs rounded-lg border bg-zinc-900/90 border-zinc-800 focus:border-zinc-500 text-zinc-100 placeholder-zinc-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] uppercase font-bold tracking-wider text-zinc-400 font-mono mb-1">Email</label>
                      <input
                        type="email"
                        required
                        value={formInput.email}
                        onChange={(e) => setFormInput({ ...formInput, email: e.target.value })}
                        placeholder="john@firm.com"
                        className="w-full px-3 py-2 text-xs rounded-lg border bg-zinc-900/90 border-zinc-800 focus:border-zinc-500 text-zinc-100 placeholder-zinc-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-[10px] uppercase font-bold tracking-wider text-zinc-400 font-mono mb-1">Handshake Requirements</label>
                    <textarea
                      rows="3"
                      required
                      value={formInput.message}
                      onChange={(e) => setFormInput({ ...formInput, message: e.target.value })}
                      placeholder="Describe the network configuration, structured server layout, or projects..."
                      className="w-full px-3 py-2 text-xs rounded-lg border bg-zinc-900/90 border-zinc-800 focus:border-zinc-500 text-zinc-100 placeholder-zinc-500 focus:outline-none"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-white hover:bg-zinc-200 text-black font-bold text-xs uppercase tracking-wider transition-all shadow-sm"
                  >
                    Transmit Packet Handshake
                  </button>
                </form>
              </div>

            </div>

          </main>

          {/* FOOTER */}
          <footer className="border-t py-12 mt-12 bg-black border-zinc-850 border-zinc-900 text-zinc-500">
            <div className="max-w-4xl mx-auto px-4 text-center space-y-3">
              <div className="flex items-center justify-center space-x-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <p className="text-xs font-mono font-medium text-zinc-400">Gateway Node Active | Thrissur, Kerala</p>
              </div>
              <p className="text-[10px] uppercase font-mono tracking-widest text-zinc-600">
                &copy; {new Date().getFullYear()} AMAL V A. All network packets preserved under secure structures.
              </p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
