      header, .no-print { display: none !important; }

        animation: none !important;
        transition: none !important;
        transform: none !important;

      background: #f1f5f9;
    }

    /* ============================================================
       GOOGLE ANTIGRAVITY "LIFTOFF" TRANSITION SYSTEM
       ============================================================ */
    @keyframes navSlideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-nav-down {
      animation: navSlideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* GOOGLE SPECTRUM GRADIENT FLOW */
    @keyframes googleSpectrumFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animate-spectrum-flow {
      background-size: 200% 200%;
      animation: googleSpectrumFlow 6s ease infinite;
    }

    /* WEIGHTLESS LIFTOFF ENTRANCE KEYFRAMES */
    @keyframes antigravityLiftoff {
      0% {
        opacity: 0;
        transform: perspective(1000px) translateY(45px) scale(0.96);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: perspective(1000px) translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* FIRST SHOWING CARD (HERO) TRANSITION SEQUENCE */
    @keyframes heroBadgeLiftoff {
      0% { opacity: 0; transform: translateY(-20px) scale(0.9); filter: blur(4px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes heroTitleLiftoff {
      0% { opacity: 0; transform: translateY(32px); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes heroSubLiftoff {
      0% { opacity: 0; transform: translateY(22px); filter: blur(4px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes heroSearchLiftoff {
      0% { opacity: 0; transform: translateY(28px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes heroChipsLiftoff {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }

    @keyframes ambientAntigravityGlow {
      0%, 100% { opacity: 0.35; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.65; transform: translate(-50%, -50%) scale(1.1); }

    .hero-badge-anim {
      animation: heroBadgeLiftoff 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;

    .hero-search-anim {

    .hero-chips-anim {

      left: 50%;
      transform: translate(-50%, -50%);

      height: 380px;
      border-radius: 9999px;

    /* ALL CONTENT LAYERS STAGGERED LIFTOFF */
    .layer-card-1 { animation: antigravityLiftoff 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both; }

    html:not(.dark) .interactive-layer-card:hover {

    /* TELEMETRY BEACON PULSE WITH GOOGLE SPECTRUM GLOW */
    @keyframes beaconRadar {
      0% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.6); opacity: 0; }

    /* MODAL ANIMATIONS */

    }

      animation: modalScaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

    const MailIcon = ({ className = "w-4 h-4" }) => (

        <path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>

    const PhoneIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
      </svg>

    // --- INTERACTIVE GOOGLE ANTIGRAVITY PARTICLE ENGINE (Liftoff & Zero-G Mesh) ---
    const AntigravityCanvas = ({ isDarkMode }) => {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        const container = containerRef.current;
        if (!canvas || !container) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let isVisible = true;

        let canvasWidth = 800;
        let canvasHeight = 300;

        const particleCount = 125;
        const particles = [];
        // Google Antigravity Signature Color Palette (Blue, Green, Yellow, Red, Starlight)
        const colors = isDarkMode 
          ? ['rgba(50, 121, 249, 0.8)', 'rgba(0, 185, 92, 0.8)', 'rgba(251, 188, 4, 0.8)', 'rgba(252, 65, 61, 0.8)', 'rgba(255, 255, 255, 0.9)']
          : ['rgba(50, 121, 249, 0.7)', 'rgba(0, 185, 92, 0.7)', 'rgba(251, 188, 4, 0.7)', 'rgba(252, 65, 61, 0.7)', 'rgba(30, 41, 59, 0.6)'];

        const initParticles = (width, height) => {
          particles.length = 0;
          for (let i = 0; i < particleCount; i++) {
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              // Anti-gravity upward buoyancy (Liftoff trajectory)
              vx: (Math.random() - 0.5) * 0.6,
              vy: -(Math.random() * 0.7 + 0.15),
              radius: Math.random() * 2.2 + 1.2,
              color: colors[Math.floor(Math.random() * colors.length)],
              opacity: Math.random() * 0.5 + 0.35,
              life: Math.random() * 200 + 100,
              originalLife: 300
            });
          }
        };

        const resizeObserver = new ResizeObserver((entries) => {
          for (let entry of entries) {
            const { width, height } = entry.contentRect;
            const w = width || 800;
            const h = height || 300;
            
            canvasWidth = w;
            canvasHeight = h;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (particles.length === 0) {
              initParticles(w, h);
            }
          }
        });

        resizeObserver.observe(container);

        const intersectionObserver = new IntersectionObserver(([entry]) => {
          isVisible = entry.isIntersecting;
          if (isVisible && !animationFrameId) {
            animate();
          }
        }, { threshold: 0.05 });
        intersectionObserver.observe(container);

        let mouse = { x: null, y: null, radius: 130 };

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.clientX - rect.left;
          mouse.y = e.clientY - rect.top;
        };

        const handleMouseLeave = () => {
          mouse.x = null;
          mouse.y = null;
        };

        container.addEventListener('mousemove', handleMouseMove);
        container.addEventListener('mouseleave', handleMouseLeave);

        const animate = () => {
          if (!isVisible) {
            animationFrameId = null;
            return;
          }

          ctx.clearRect(0, 0, canvasWidth, canvasHeight);

          // Google Antigravity Radial Mesh Backdrop
          const gradient = ctx.createRadialGradient(
            canvasWidth / 2, canvasHeight / 2, 20,
            canvasWidth / 2, canvasHeight / 2, canvasWidth / 1.3
          );
          if (isDarkMode) {
            gradient.addColorStop(0, 'rgba(50, 121, 249, 0.05)');
            gradient.addColorStop(0.3, 'rgba(0, 185, 92, 0.02)');
            gradient.addColorStop(0.7, 'rgba(251, 188, 4, 0.01)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
          } else {
            gradient.addColorStop(0, 'rgba(50, 121, 249, 0.04)');
            gradient.addColorStop(0.5, 'rgba(0, 185, 92, 0.02)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
          }
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);

          // Render Antigravity Constellation Lines between nearby particles
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 60) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = isDarkMode 
                  ? `rgba(50, 121, 249, ${0.12 * (1 - dist / 60)})` 
                  : `rgba(50, 121, 249, ${0.08 * (1 - dist / 60)})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }
          }

          // Update & Draw Particles with Anti-Gravity Upward Motion
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            p.x += p.vx;
            p.y += p.vy; // Floating upward
            p.vx += Math.sin(p.y * 0.015) * 0.01;

            // Zero-G Mouse Repulsion and Dispersion
            if (mouse.x !== null && mouse.y !== null) {
              const dx = p.x - mouse.x;
              const dy = p.y - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const force = (mouse.radius - dist) / mouse.radius;
                const angle = Math.atan2(dy, dx);
                p.x += Math.cos(angle) * force * 3.5;
                p.y += Math.sin(angle) * force * 3.5;
              }
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity * (p.life / p.originalLife);
            ctx.fill();

            p.life--;

            // Respawn from bottom or edge when particle escapes off top (continuous liftoff)
            if (p.life <= 0 || p.y < -15 || p.x < -15 || p.x > canvasWidth + 15 || p.y > canvasHeight + 15) {
              p.x = Math.random() * canvasWidth;
              p.y = canvasHeight + Math.random() * 20;
              p.vx = (Math.random() - 0.5) * 0.6;
              p.vy = -(Math.random() * 0.7 + 0.15);
              p.life = Math.random() * 200 + 100;
              p.opacity = Math.random() * 0.5 + 0.35;
            }
          }

          ctx.globalAlpha = 1.0;
          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          resizeObserver.disconnect();
          intersectionObserver.disconnect();
          container.removeEventListener('mousemove', handleMouseMove);
          container.removeEventListener('mouseleave', handleMouseLeave);
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [isDarkMode]);

      return (
        <div ref={containerRef} className="absolute inset-0 w-full h-full z-0 overflow-hidden">
          <canvas ref={canvasRef} className="block w-full h-full" />
        </div>
      );
    };

    const AntigravityTiltCard = ({ children, className = "", staggerClass = "" }) => {
      const cardRef = useRef(null);
      const [tiltStyle, setTiltStyle] = useState({});

      const handleMouseMove = (e) => {
        const card = cardRef.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -5;
        const rotateY = ((x - centerX) / centerX) * 5;

        setTiltStyle({
          transform: `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-8px) scale3d(1.012, 1.012, 1.012)`,
          '--card-spot-x': `${x}px`,
          '--card-spot-y': `${y}px`,
          transition: 'transform 0.08s ease-out',
        });
      };

      const handleMouseLeave = () => {
        setTiltStyle({
          transform: 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px) scale3d(1, 1, 1)',
          transition: 'transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease, border-color 0.4s ease',
        });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={tiltStyle}
          className={`relative group interactive-layer-card ${staggerClass} ${className}`}
        >
          {/* Reactive Google Antigravity Cursor Spotlight Glow on Card Border & Face */}

              background: `radial-gradient(350px circle at var(--card-spot-x, 50%) var(--card-spot-y, 50%), rgba(50, 121, 249, 0.18), rgba(0, 185, 92, 0.1), transparent 70%)`,
              borderRadius: 'inherit'
            }}
          />
          <div className="relative z-20 w-full h-full">
            {children}
          </div>
        </div>
      );

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-zinc-400 mb-1">Your Name</label>
                    <input
                      type="text"
                      required
                      value={formInput.name}
                      onChange={(e) => setFormInput({ ...formInput, name: e.target.value })}
                      placeholder="Your Name"
                      className="w-full px-3 py-2 text-xs rounded-lg border bg-slate-50 dark:bg-zinc-900/90 border-slate-300 dark:border-zinc-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 dark:focus:border-emerald-500 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none transition-all duration-200"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-zinc-400 mb-1">Email</label>
                    <input
                      type="email"
                      required
                      value={formInput.email}
                      onChange={(e) => setFormInput({ ...formInput, email: e.target.value })}
                      placeholder="your.email@example.com"
                      className="w-full px-3 py-2 text-xs rounded-lg border bg-slate-50 dark:bg-zinc-900/90 border-slate-300 dark:border-zinc-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 dark:focus:border-emerald-500 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none transition-all duration-200"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-zinc-400 mb-1">Message</label>
                  <textarea
                    rows="3"
                    required
                    value={formInput.message}
                    onChange={(e) => setFormInput({ ...formInput, message: e.target.value })}
                    placeholder="Discuss network engineering placement, routing/switching projects, or rack setup..."
                    className="w-full px-3 py-2 text-xs rounded-lg border bg-slate-50 dark:bg-zinc-900/90 border-slate-300 dark:border-zinc-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 dark:focus:border-emerald-500 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none transition-all duration-200"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white dark:bg-white dark:hover:bg-zinc-200 dark:text-black font-bold text-xs uppercase tracking-wider transition-all duration-200 hover:-translate-y-0.5 active:scale-95 shadow-sm hover:shadow-lg"
                >
                  Send Message
                </button>
              </form>
            </AntigravityTiltCard>

          </main>

          {/* FOOTER */}
          <footer className="border-t py-10 mt-12 bg-white dark:bg-[#121317] border-slate-200 dark:border-zinc-900 text-slate-600 dark:text-zinc-500 transition-colors layer-card-footer">
            <div className="max-w-4xl mx-auto px-4 text-center space-y-2">
              <p className="text-xs font-medium text-slate-700 dark:text-zinc-400">Thrissur, Kerala, India</p>
              <p className="text-xs text-slate-500 dark:text-zinc-600">
                &copy; {new Date().getFullYear()} Amal V A. All rights reserved.
              </p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
