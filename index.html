    // --- INTERACTIVE ANTIGRAVITY ENGINE (HTML5 CANVAS Particle Flow) ---
    const AntigravityCanvas = ({ isDarkMode }) => {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        const container = containerRef.current;
        if (!canvas || !container) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let isVisible = true;

        let canvasWidth = 800;
        let canvasHeight = 300;

        const particleCount = 110;
        const particles = [];
        const colors = isDarkMode 
          ? ['rgba(255, 255, 255, 0.6)', 'rgba(210, 210, 210, 0.45)', 'rgba(160, 160, 160, 0.35)', 'rgba(255, 255, 255, 0.3)', 'rgba(120, 120, 120, 0.25)']
          : ['rgba(30, 30, 30, 0.4)', 'rgba(60, 60, 60, 0.4)', 'rgba(100, 100, 100, 0.3)', 'rgba(0, 0, 0, 0.4)', 'rgba(140, 140, 140, 0.3)'];

        const initParticles = (width, height) => {
          particles.length = 0;
          const centerX = width / 2;
          const centerY = height / 2;

          for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 120 + 10;
            particles.push({
              x: centerX + Math.cos(angle) * distance,
              y: centerY + Math.sin(angle) * distance,
              vx: Math.cos(angle) * (Math.random() * 0.7 + 0.1),
              vy: Math.sin(angle) * (Math.random() * 0.7 + 0.1) - (Math.random() * 0.3 + 0.1),
              radius: Math.random() * 2 + 1,
              color: colors[Math.floor(Math.random() * colors.length)],
              opacity: Math.random() * 0.4 + 0.3,
              life: Math.random() * 150 + 100,
              originalLife: 250
            });
          }
        };

        const resizeObserver = new ResizeObserver((entries) => {
          for (let entry of entries) {
            const { width, height } = entry.contentRect;
            const w = width || 800;
            const h = height || 300;
            
            canvasWidth = w;
            canvasHeight = h;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (particles.length === 0) {
              initParticles(w, h);
            }
          }
        });

        resizeObserver.observe(container);

        const intersectionObserver = new IntersectionObserver(([entry]) => {
          isVisible = entry.isIntersecting;
          if (isVisible && !animationFrameId) {
            animate();
          }
        }, { threshold: 0.05 });
        intersectionObserver.observe(container);

        let mouse = { x: null, y: null, radius: 110 };

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.clientX - rect.left;
          mouse.y = e.clientY - rect.top;
        };

        const handleMouseLeave = () => {
          mouse.x = null;
          mouse.y = null;
        };

        container.addEventListener('mousemove', handleMouseMove);
        container.addEventListener('mouseleave', handleMouseLeave);

        const animate = () => {
          if (!isVisible) {
            animationFrameId = null;
            return;
          }

          ctx.clearRect(0, 0, canvasWidth, canvasHeight);

          const gradient = ctx.createRadialGradient(
            canvasWidth / 2, canvasHeight / 2, 30,
            canvasWidth / 2, canvasHeight / 2, canvasWidth / 1.4
          );
          if (isDarkMode) {
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.04)');
            gradient.addColorStop(0.5, 'rgba(100, 100, 100, 0.015)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
          } else {
            gradient.addColorStop(0, 'rgba(30, 30, 30, 0.03)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
          }
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            p.x += p.vx;
            p.y += p.vy;
            p.vx += Math.sin(p.y * 0.02) * 0.005;

            if (mouse.x !== null && mouse.y !== null) {
              const dx = p.x - mouse.x;
              const dy = p.y - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const force = (mouse.radius - dist) / mouse.radius;
                const angle = Math.atan2(dy, dx);
                p.x += Math.cos(angle) * force * 3;
                p.y += Math.sin(angle) * force * 3;
              }
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity * (p.life / p.originalLife);
            ctx.fill();

            p.life--;

            if (p.life <= 0 || p.y < -15 || p.x < -15 || p.x > canvasWidth + 15 || p.y > canvasHeight + 15) {
              const angle = Math.random() * Math.PI * 2;
              const dist = Math.random() * 50 + 5;
              p.x = (canvasWidth / 2) + Math.cos(angle) * dist;
              p.y = (canvasHeight / 2) + Math.sin(angle) * dist + 30;
              p.vx = Math.cos(angle) * (Math.random() * 0.5 + 0.1);
              p.vy = Math.sin(angle) * (Math.random() * 0.5 + 0.1) - (Math.random() * 0.4 + 0.1);
              p.life = Math.random() * 150 + 100;
              p.opacity = Math.random() * 0.4 + 0.3;
            }
          }

          ctx.globalAlpha = 1.0;
          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          resizeObserver.disconnect();
          intersectionObserver.disconnect();
          container.removeEventListener('mousemove', handleMouseMove);
          container.removeEventListener('mouseleave', handleMouseLeave);
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [isDarkMode]);

      return (
        <div ref={containerRef} className="absolute inset-0 w-full h-full z-0 overflow-hidden">
          <canvas ref={canvasRef} className="block w-full h-full" />
        </div>
      );
    };

                  ) : (
                    <svg fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor" className="w-4 h-4 text-zinc-600">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                    </svg>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* FLOATING SYSTEM TOAST */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 animate-slide-up no-print">
              <div className={`p-4 rounded-xl border shadow-2xl flex items-center space-x-3 ${
                toast.type === 'error' ? 'bg-red-950 border-red-800 text-red-200' : 'bg-zinc-900 text-white border-zinc-700'
              }`}>
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <p className="text-xs font-semibold">{toast.text}</p>
              </div>
            </div>
          )}

          {/* CORE HERO SECTION (KEPT EXACTLY SAME AS REQUESTED) */}
          <section className="relative w-full overflow-hidden border-b border-zinc-800/80 bg-black no-print">
            
            <AntigravityCanvas isDarkMode={isDarkMode} />

            {/* Content Overlay */}
            <div className="relative z-10 max-w-4xl mx-auto px-4 pt-16 pb-12 text-center pointer-events-none">
              <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-zinc-900/90 mb-6 border border-zinc-800 backdrop-blur-md">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-[11px] font-bold uppercase tracking-wider text-zinc-300">Available For Engineering Placements</span>
              </div>

              <h2 className="text-3xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight leading-tight max-w-3xl mx-auto select-none text-white">
                Network Engineer specialized in enterprise routing, switching, and robust hardware infrastructure.
              </h2>
              <p className="text-sm sm:text-base text-zinc-400 mt-4 max-w-xl mx-auto select-none">
                CCNA & Hardware certified Network Engineer ready to optimize, troubleshoot, and maintain clean enterprise IT infrastructure layouts.
              </p>

              {/* Interactive Search Bar */}
              <div className="max-w-xl mx-auto mt-8 relative pointer-events-auto">
                <div className="flex items-center px-4 py-2.5 rounded-full border shadow-lg transition-all bg-zinc-900/90 border-zinc-800 focus-within:border-zinc-600 focus-within:ring-1 focus-within:ring-zinc-600">
                  <SearchIcon />
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="Search CV competencies (e.g. OSPF, 2921, 3750G, Cabling, CCTV, GNS3...)"
                    className="ml-3 flex-1 bg-transparent border-none text-xs focus:ring-0 focus:outline-none placeholder-zinc-500 text-zinc-100"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="text-xs text-zinc-400 hover:text-white font-semibold px-2">Clear</button>
                  )}
                </div>
              </div>
            </div>
          </section>

          {/* MAIN CV CONTENT GRID */}
          <main className="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 w-full bg-black">
            
            {/* LEFT COLUMN: PROFILE SUMMARY, DETAILED WORK EXPERIENCE, EDUCATION */}
            <div className="lg:col-span-2 space-y-6">
              
              {/* PROFILE CARD: PERSONAL DETAILS & PROFESSIONAL SUMMARY */}
              <div className="p-6 rounded-2xl border bg-zinc-950/70 border-zinc-800/80 shadow-xl backdrop-blur-sm">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                  <div>
                    <h1 className="text-2xl font-black tracking-tight text-white">{profileData.name}</h1>
                    <p className="text-xs uppercase tracking-wider font-bold text-zinc-400 mt-0.5">{profileData.role}</p>
                  </div>
                  <div className="flex flex-wrap gap-1.5 text-[11px] font-mono">
                    <span className="px-2.5 py-0.5 rounded-md bg-zinc-900 text-zinc-300 border border-zinc-800">{profileData.location}</span>
                    <span className="px-2.5 py-0.5 rounded-md bg-emerald-950/50 text-emerald-400 border border-emerald-800/80">Available</span>
                  </div>
                </div>

                <p className="text-xs leading-relaxed text-zinc-300">
                  {profileData.summary}
                </p>

                {/* Contact & Redirect Channels: Box Type Model (Masked Links) */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-2.5 mt-6 pt-4 border-t border-zinc-800/80 text-xs font-mono">
                  
                  {/* LinkedIn Box */}
                  <a
                    href={profileData.linkedinUrl}
                    target="_blank"
                    rel="noreferrer"
                    className="group p-3 rounded-xl border border-zinc-800/90 bg-zinc-900/60 hover:bg-zinc-800/80 hover:border-blue-500/50 transition-all duration-200 hover:-translate-y-0.5 shadow-sm flex flex-col justify-between"
                  >
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] uppercase tracking-wider text-zinc-400 group-hover:text-blue-400 flex items-center gap-1.5 transition-colors">
                        <LinkedInIcon /> LinkedIn
                      </span>
                      <ExternalArrowIcon />
                    </div>
                    <span className="font-bold text-xs text-white group-hover:text-blue-300 transition-colors truncate">
                      View Profile
                    </span>
                  </a>

                  {/* GitHub Repo Box */}
                  <a
                    href={profileData.repoUrl}
                    target="_blank"
                    rel="noreferrer"
                    className="group p-3 rounded-xl border border-zinc-800/90 bg-zinc-900/60 hover:bg-zinc-800/80 hover:border-zinc-500 transition-all duration-200 hover:-translate-y-0.5 shadow-sm flex flex-col justify-between"
                  >
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] uppercase tracking-wider text-zinc-400 group-hover:text-white flex items-center gap-1.5 transition-colors">
                        <GitHubIcon /> GitHub Repo
                      </span>
                      <ExternalArrowIcon />
                    </div>
                    <span className="font-bold text-xs text-white group-hover:underline transition-colors truncate">
                      View Repository
                    </span>
                  </a>

                  {/* WhatsApp Direct Chat Box */}
                  <a
                    href={profileData.whatsappUrl}
                    target="_blank"
                    rel="noreferrer"
                    className="group p-3 rounded-xl border border-emerald-900/40 bg-emerald-950/20 hover:bg-emerald-950/40 hover:border-emerald-500/60 transition-all duration-200 hover:-translate-y-0.5 shadow-sm flex flex-col justify-between"
                  >
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] uppercase tracking-wider text-emerald-400 flex items-center gap-1.5">
                        <WhatsAppIcon /> WhatsApp
                      </span>
                      <ExternalArrowIcon className="text-emerald-500 group-hover:text-emerald-300" />
                    </div>
                    <span className="font-bold text-xs text-emerald-300 group-hover:underline transition-colors truncate">
                      Chat on WhatsApp
                    </span>
                  </a>

                  {/* Email Box */}
                  <a
                    href={`mailto:${profileData.email}`}
                    className="group p-3 rounded-xl border border-zinc-800/90 bg-zinc-900/60 hover:bg-zinc-800/80 hover:border-zinc-500 transition-all duration-200 hover:-translate-y-0.5 shadow-sm flex flex-col justify-between"
                  >
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] uppercase tracking-wider text-zinc-400 group-hover:text-white flex items-center gap-1.5 transition-colors">
                        <MailIcon /> Email
                      </span>
                      <ExternalArrowIcon />
                    </div>
                    <span className="font-bold text-xs text-white group-hover:underline transition-colors truncate">
                      Send Email
                    </span>
                  </a>

                  {/* Phone Box */}
                  <a
                    href={`tel:${profileData.phone}`}
                    className="group p-3 rounded-xl border border-zinc-800/90 bg-zinc-900/60 hover:bg-zinc-800/80 hover:border-zinc-500 transition-all duration-200 hover:-translate-y-0.5 shadow-sm flex flex-col justify-between"
                  >
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] uppercase tracking-wider text-zinc-400 group-hover:text-white flex items-center gap-1.5 transition-colors">
                        <PhoneIcon /> Phone
                      </span>
                      <ExternalArrowIcon />
                    </div>
                    <span className="font-bold text-xs text-white group-hover:underline transition-colors truncate">
                      Direct Call
                    </span>
                  </a>

                </div>
              </div>

              {/* PROFESSIONAL EXPERIENCE: ETHERLABS & IGATE NETWORKS */}
              <div className="p-6 rounded-2xl border bg-zinc-950/70 border-zinc-800/80 shadow-xl backdrop-blur-sm">
                <div className="flex items-center justify-between mb-5 border-b border-zinc-800/80 pb-3">
                  <h3 className="font-bold text-sm uppercase tracking-wider text-zinc-400">Professional Experience</h3>
                  <span className="text-[11px] font-mono text-zinc-500">2 Enterprise Roles</span>
                </div>

                <div className="space-y-8">
                  {experienceList.map((exp, idx) => (
                    <div key={idx} className={idx > 0 ? "pt-6 border-t border-zinc-900" : ""}>
                      <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                        <div className="inline-block bg-white text-black border border-white px-3 py-1 rounded-xl shadow-sm">
                          <h4 className="text-sm font-black tracking-tight">{exp.company}</h4>
                        </div>
                        <span className="text-xs font-mono px-2.5 py-0.5 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-300">
                          {exp.period}
                        </span>
                      </div>
                      
                      <p className="text-xs text-zinc-400 font-mono mb-3">
                        <span className="font-bold text-zinc-200">{exp.role}</span> — {exp.location}
                      </p>
                      
                      <ul className="space-y-2.5">
                        {exp.tasks.map((task, tIdx) => {
                          const isMatch = matchesSearch(task) || matchesSearch(exp.company) || matchesSearch(exp.role);
                          return (
                            <li 
                              key={tIdx} 
                              className={`flex items-start text-xs leading-relaxed transition-opacity duration-300 ${
                                isMatch ? 'text-zinc-300 opacity-100' : 'opacity-25'
                              }`}
                            >
                              <span className="text-zinc-100 mr-2 font-bold select-none">•</span>
                              <span>{task}</span>
                            </li>
                          );
                        })}
                      </ul>
                    </div>
                  ))}
                </div>
              </div>

              {/* CERTIFICATIONS & EDUCATION (FROM CV) */}
              <div className="p-6 rounded-2xl border bg-zinc-950/70 border-zinc-800/80 shadow-xl backdrop-blur-sm">
                <h3 className="font-bold text-sm uppercase tracking-wider text-zinc-400 mb-4 pb-2 border-b border-zinc-800/80">
                  Certifications & Education
                </h3>

                <div className="space-y-4">
                  {educationData.map((edu, idx) => {
                    const isMatch = matchesSearch(edu.title) || matchesSearch(edu.institution) || matchesSearch(edu.credentialId || '');
                    return (
                      <div 
                        key={idx} 
                        className={`flex items-start space-x-3 transition-opacity duration-300 ${isMatch ? 'opacity-100' : 'opacity-25'}`}
                      >
                        <div className="mt-1">
                          <span className="w-1.5 h-1.5 rounded-full bg-zinc-200 block"></span>
                        </div>
                        <div className="flex-1">
                          <div className="flex items-baseline justify-between gap-2 flex-wrap">
                            <div className="flex items-center gap-2 flex-wrap">
                              <h4 className="text-xs font-bold text-white">{edu.title}</h4>
                              {edu.credentialId && (
                                <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-zinc-900 border border-zinc-700 text-emerald-400 font-semibold tracking-wider">
                                  ID: {edu.credentialId}
                                </span>
                              )}
                            </div>
                            <span className="text-[10px] font-mono text-zinc-500">{edu.year}</span>
                          </div>
                          <p className="text-[11px] text-zinc-400 font-mono mt-0.5">{edu.institution} — <span className="italic">{edu.location}</span></p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

            </div>

            {/* RIGHT COLUMN: TECHNICAL SKILLS (CATEGORIZED CV MATRIX), DIAGNOSTICS, CONTACT */}
            <div className="space-y-6">
              
              {/* TECHNICAL SKILL MATRIX: 4 STRUCTURED CATEGORIES FROM CV */}
              <div className="p-6 rounded-2xl border bg-zinc-950/70 border-zinc-800/80 shadow-xl backdrop-blur-sm">
                <div className="flex items-center justify-between mb-4 pb-2 border-b border-zinc-800/80">
                  <h3 className="font-bold text-sm uppercase tracking-wider text-zinc-400">
                    Technical Skills
                  </h3>
                </div>

                <div className="space-y-5">
                  {skillCategories.map((cat, cIdx) => (
                    <div key={cIdx}>
                      <h4 className="text-[11px] font-mono uppercase font-bold text-zinc-400 mb-2 tracking-wider flex items-center gap-1.5">
                        <span className="w-1.5 h-1.5 rounded-full bg-zinc-500"></span>
                        {cat.title}
                      </h4>
                      <div className="flex flex-wrap gap-1.5">
                        {cat.skills.map((skill, sIdx) => {
                          const isMatch = matchesSearch(skill) || matchesSearch(cat.title);
                          return (
                            <span
                              key={sIdx}
                              className={`px-2.5 py-1 rounded-md text-[11px] font-mono font-medium border transition-all duration-300 ${
                                isMatch 
                                  ? 'bg-zinc-900 border-zinc-700 text-zinc-200 hover:border-zinc-500' 
                                  : 'opacity-20'
                              }`}
                            >
                              {skill}
                            </span>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="mt-6 pt-4 border-t border-zinc-800/80 text-[11px] text-zinc-400">
                  Languages: <strong className="text-zinc-200">{languages.join(', ')}</strong>
                </div>
              </div>

              {/* DIAGNOSTICS & PING CENTER */}
              <div className="p-6 rounded-2xl border bg-zinc-950/70 border-zinc-800/80 shadow-xl backdrop-blur-sm">
                <h3 className="font-bold text-sm uppercase tracking-wider text-zinc-400 mb-4 pb-2 border-b border-zinc-800/80">
                  Network Latency Diagnostics
                </h3>
                
                <p className="text-xs text-zinc-400 mb-4 leading-relaxed">
                  Simulate ICMP diagnostics to Amal VA's enterprise gateway node directly from your browser.
                </p>

                <button
                  onClick={runPingDiag}
                  disabled={isPinging}
                  className={`w-full py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition-all border ${
                    isPinging 
                      ? 'bg-zinc-900 text-zinc-500 border-zinc-800 cursor-not-allowed' 
                      : 'bg-white text-black hover:bg-zinc-200 border-white'
                  }`}
                >
                  {isPinging ? 'Pinging Node...' : 'Ping amalva.in'}
                </button>

                {pingResult && (
                  <pre className="mt-4 p-4 rounded-xl bg-black text-emerald-400 border border-zinc-800 font-mono text-[10px] leading-relaxed overflow-x-auto whitespace-pre-wrap max-h-36">
                    {pingResult}
                  </pre>
                )}
              </div>

              {/* CONTACT GATEWAY */}
              <div className="p-6 rounded-2xl border bg-zinc-950/70 border-zinc-800/80 shadow-xl backdrop-blur-sm">
                <h3 className="font-bold text-sm uppercase tracking-wider text-zinc-400 mb-4 pb-2 border-b border-zinc-800/80">
                  Establish Handshake
                </h3>

                <form onSubmit={handleContactSubmit} className="space-y-4">
                  <div className="space-y-3">
                    <div>
                      <label className="block text-[10px] uppercase font-bold tracking-wider text-zinc-400 font-mono mb-1">Your Name</label>
                      <input
                        type="text"
                        required
                        value={formInput.name}
                        onChange={(e) => setFormInput({ ...formInput, name: e.target.value })}
                        placeholder="Enterprise Recruiter"
                        className="w-full px-3 py-2 text-xs rounded-lg border bg-zinc-900/90 border-zinc-800 focus:border-zinc-500 text-zinc-100 placeholder-zinc-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-[10px] uppercase font-bold tracking-wider text-zinc-400 font-mono mb-1">Email</label>
                      <input
                        type="email"
                        required
                        value={formInput.email}
                        onChange={(e) => setFormInput({ ...formInput, email: e.target.value })}
                        placeholder="recruiter@enterprise.com"
                        className="w-full px-3 py-2 text-xs rounded-lg border bg-zinc-900/90 border-zinc-800 focus:border-zinc-500 text-zinc-100 placeholder-zinc-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-[10px] uppercase font-bold tracking-wider text-zinc-400 font-mono mb-1">Handshake Requirements</label>
                    <textarea
                      rows="3"
                      required
                      value={formInput.message}
                      onChange={(e) => setFormInput({ ...formInput, message: e.target.value })}
                      placeholder="Discuss network engineering placement, routing/switching projects, or rack setup..."
                      className="w-full px-3 py-2 text-xs rounded-lg border bg-zinc-900/90 border-zinc-800 focus:border-zinc-500 text-zinc-100 placeholder-zinc-500 focus:outline-none"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-white hover:bg-zinc-200 text-black font-bold text-xs uppercase tracking-wider transition-all shadow-sm"
                  >
                    Transmit Packet Handshake
                  </button>

                  <div className="relative flex items-center justify-center my-3">
                    <span className="w-full border-t border-zinc-800"></span>
                    <span className="px-2 text-[10px] uppercase font-mono text-zinc-500 bg-zinc-950">or instant message</span>
                    <span className="w-full border-t border-zinc-800"></span>
                  </div>

                  <a
                    href={profileData.whatsappUrl}
                    target="_blank"
                    rel="noreferrer"
                    className="w-full py-2.5 rounded-xl border border-emerald-500/30 bg-emerald-950/20 hover:bg-emerald-950/40 text-emerald-400 font-bold text-xs uppercase tracking-wider transition-all flex items-center justify-center gap-2"
                  >
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    Chat on WhatsApp
                  </a>
                </form>
              </div>

            </div>

          </main>

          {/* FOOTER */}
          <footer className="border-t py-12 mt-12 bg-black border-zinc-900 text-zinc-500">
            <div className="max-w-4xl mx-auto px-4 text-center space-y-3">
              <div className="flex items-center justify-center space-x-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <p className="text-xs font-mono font-medium text-zinc-400">Gateway Node Active | Thrissur, Kerala</p>
              </div>
              <p className="text-[10px] uppercase font-mono tracking-widest text-zinc-600">
                &copy; {new Date().getFullYear()} AMAL V A. All network packets preserved under secure structures.
              </p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
