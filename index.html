  <!-- Google Antigravity Transition Engine & Global Styles -->
  <style>
    :root {
      --palette-grey-1200: #121317;
      --palette-grey-1100: #18191d;
      --palette-grey-1000: #212226;
      --palette-blue-600: #3279f9;
      --palette-green-600: #00b95c;
      --palette-yellow-600: #fbbc04;
      --palette-red-600: #fc413d;
    }

    /* APPLY GOOGLE SANS FLEX TO ALL TEXT ACROSS ENTIRE PORTFOLIO (PERSONAL, HEADINGS, BODY, BADGES, BUTTONS, CARDS) */
    *, *::before, *::after, html, body, button, input, textarea, select {
      font-family: 'Google Sans Flex', 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
    }

    /* TERMINAL & CODE TEXT */
    pre, pre *, code, code *, .terminal-code, .terminal-code * {
      font-family: 'Google Sans Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    }

    @keyframes slideUp {
      from { transform: translateY(1rem); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @media print {
      header, .no-print { display: none !important; }
      body { background: white !important; color: black !important; }
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        transform: none !important;
      }
    }
    /* Sleek custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    html.dark ::-webkit-scrollbar-track {
      background: #121317;
    }
    html.dark ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
    html.dark ::-webkit-scrollbar-thumb:hover {
      background: #3279f9;
    }
    html:not(.dark) ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    html:not(.dark) ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    html:not(.dark) ::-webkit-scrollbar-thumb:hover {
      background: #3279f9;
    }

    /* ============================================================
       GOOGLE ANTIGRAVITY "LIFTOFF" TRANSITION SYSTEM
       ============================================================ */
    @keyframes navSlideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-nav-down {
      animation: navSlideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* GOOGLE SPECTRUM GRADIENT FLOW */
    @keyframes googleSpectrumFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animate-spectrum-flow {
      background-size: 200% 200%;
      animation: googleSpectrumFlow 6s ease infinite;
    }

    /* WEIGHTLESS LIFTOFF ENTRANCE KEYFRAMES */
    @keyframes antigravityLiftoff {
      0% {
        opacity: 0;
        transform: perspective(1000px) translateY(45px) scale(0.96);
        filter: blur(8px);
      }
      100% {
        opacity: 1;
        transform: perspective(1000px) translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* FIRST SHOWING CARD (HERO) TRANSITION SEQUENCE */
    @keyframes heroBadgeLiftoff {
      0% { opacity: 0; transform: translateY(-20px) scale(0.9); filter: blur(4px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes heroTitleLiftoff {
      0% { opacity: 0; transform: translateY(32px); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes heroSubLiftoff {
      0% { opacity: 0; transform: translateY(22px); filter: blur(4px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    @keyframes heroSearchLiftoff {
      0% { opacity: 0; transform: translateY(28px) scale(0.96); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes heroChipsLiftoff {
      0% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes ambientAntigravityGlow {
      0%, 100% { opacity: 0.35; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.65; transform: translate(-50%, -50%) scale(1.1); }
    }

    .hero-badge-anim {
      animation: heroBadgeLiftoff 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
    }
    .hero-title-anim {
      animation: heroTitleLiftoff 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.16s both;
    }
    .hero-sub-anim {
      animation: heroSubLiftoff 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both;
    }
    .hero-search-anim {
      animation: heroSearchLiftoff 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
    }
    .hero-chips-anim {
      animation: heroChipsLiftoff 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both;
    }
    .hero-ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 380px;
      border-radius: 9999px;
      pointer-events: none;
      animation: ambientAntigravityGlow 8s ease-in-out infinite;
      filter: blur(85px);
      z-index: 1;
    }

    /* ALL CONTENT LAYERS STAGGERED LIFTOFF */
    .layer-card-1 { animation: antigravityLiftoff 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both; }
    .layer-card-2 { animation: antigravityLiftoff 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.32s both; }
    .layer-card-3 { animation: antigravityLiftoff 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.46s both; }
    .layer-card-4 { animation: antigravityLiftoff 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.24s both; }
    .layer-card-5 { animation: antigravityLiftoff 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.38s both; }
    .layer-card-6 { animation: antigravityLiftoff 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both; }
    .layer-card-footer { animation: antigravityLiftoff 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.62s both; }

    /* ZERO-GRAVITY CONTINUOUS LEVITATION (WEIGHTLESS FLOAT) */
    @keyframes zeroGravityFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .zero-g-float {
      animation: zeroGravityFloat 6s ease-in-out infinite;
    }

    /* INTERACTIVE 3D PERSPECTIVE LAYER CARD & SPOTLIGHT DYNAMICS */
    .interactive-layer-card {
      position: relative;
      transform-style: preserve-3d;
      will-change: transform, box-shadow, border-color;
      border-radius: 1.25rem;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    html.dark .interactive-layer-card:hover {
      border-color: rgba(50, 121, 249, 0.4);
      box-shadow: 0 25px 50px -15px rgba(0, 0, 0, 0.85),
                  0 0 30px -5px rgba(50, 121, 249, 0.12),
                  0 0 15px -3px rgba(0, 185, 92, 0.08);
    }
    html:not(.dark) .interactive-layer-card:hover {
      border-color: rgba(50, 121, 249, 0.45);
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1),
                  0 0 25px -5px rgba(50, 121, 249, 0.08);
    }

    /* TELEMETRY BEACON PULSE WITH GOOGLE SPECTRUM GLOW */
    @keyframes beaconRadar {
      0% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    .beacon-radar {
      animation: beaconRadar 2.2s infinite ease-out;
    }
  </style>
</head>

    const GitHubIcon = ({ className = "w-4 h-4" }) => (

        <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>

    const WhatsAppIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="currentColor" viewBox="0 0 24 24">
        <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 012.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.196 8.196 0 01-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.01-1.24-.74-.66-1.24-1.48-1.39-1.73-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.43.13-.14.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.87.85-.87 2.08 0 1.23.89 2.42 1.02 2.59.13.17 1.76 2.69 4.27 3.77.6.26 1.07.41 1.43.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.11-.22-.17-.47-.3z"/>
      </svg>

    const MailIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    );

    const PhoneIcon = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
      </svg>
    );

    // --- INTERACTIVE GOOGLE ANTIGRAVITY PARTICLE ENGINE (Liftoff & Zero-G Mesh) ---
    const AntigravityCanvas = ({ isDarkMode }) => {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        const container = containerRef.current;
        if (!canvas || !container) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let isVisible = true;

        let canvasWidth = 800;
        let canvasHeight = 300;

        const particleCount = 125;
        const particles = [];
        // Google Antigravity Signature Color Palette (Blue, Green, Yellow, Red, Starlight)
        const colors = isDarkMode 
          ? ['rgba(50, 121, 249, 0.8)', 'rgba(0, 185, 92, 0.8)', 'rgba(251, 188, 4, 0.8)', 'rgba(252, 65, 61, 0.8)', 'rgba(255, 255, 255, 0.9)']
          : ['rgba(50, 121, 249, 0.7)', 'rgba(0, 185, 92, 0.7)', 'rgba(251, 188, 4, 0.7)', 'rgba(252, 65, 61, 0.7)', 'rgba(30, 41, 59, 0.6)'];

        const initParticles = (width, height) => {
          particles.length = 0;
          for (let i = 0; i < particleCount; i++) {
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              // Anti-gravity upward buoyancy (Liftoff trajectory)
              vx: (Math.random() - 0.5) * 0.6,
              vy: -(Math.random() * 0.7 + 0.15),
              radius: Math.random() * 2.2 + 1.2,
              color: colors[Math.floor(Math.random() * colors.length)],
              opacity: Math.random() * 0.5 + 0.35,
              life: Math.random() * 200 + 100,
              originalLife: 300
            });
          }
        };

        const resizeObserver = new ResizeObserver((entries) => {
          for (let entry of entries) {
            const { width, height } = entry.contentRect;
            const w = width || 800;
            const h = height || 300;
            
            canvasWidth = w;
            canvasHeight = h;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = `${w}px`;
            canvas.style.height = `${h}px`;
            
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            if (particles.length === 0) {
              initParticles(w, h);
            }
          }
        });

        resizeObserver.observe(container);

        const intersectionObserver = new IntersectionObserver(([entry]) => {
          isVisible = entry.isIntersecting;
          if (isVisible && !animationFrameId) {
            animate();
          }
        }, { threshold: 0.05 });
        intersectionObserver.observe(container);

        let mouse = { x: null, y: null, radius: 130 };

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = e.clientX - rect.left;
          mouse.y = e.clientY - rect.top;
        };

        const handleMouseLeave = () => {
          mouse.x = null;
          mouse.y = null;
        };

        container.addEventListener('mousemove', handleMouseMove);
        container.addEventListener('mouseleave', handleMouseLeave);

        const animate = () => {
          if (!isVisible) {
            animationFrameId = null;
            return;
          }

          ctx.clearRect(0, 0, canvasWidth, canvasHeight);

          // Google Antigravity Radial Mesh Backdrop
          const gradient = ctx.createRadialGradient(
            canvasWidth / 2, canvasHeight / 2, 20,
            canvasWidth / 2, canvasHeight / 2, canvasWidth / 1.3
          );
          if (isDarkMode) {
            gradient.addColorStop(0, 'rgba(50, 121, 249, 0.05)');
            gradient.addColorStop(0.3, 'rgba(0, 185, 92, 0.02)');
            gradient.addColorStop(0.7, 'rgba(251, 188, 4, 0.01)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
          } else {
            gradient.addColorStop(0, 'rgba(50, 121, 249, 0.04)');
            gradient.addColorStop(0.5, 'rgba(0, 185, 92, 0.02)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
          }
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, canvasWidth, canvasHeight);

          // Render Antigravity Constellation Lines between nearby particles
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 60) {
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.strokeStyle = isDarkMode 
                  ? `rgba(50, 121, 249, ${0.12 * (1 - dist / 60)})` 
                  : `rgba(50, 121, 249, ${0.08 * (1 - dist / 60)})`;
                ctx.lineWidth = 0.8;
                ctx.stroke();
              }
            }
          }

          // Update & Draw Particles with Anti-Gravity Upward Motion
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            p.x += p.vx;
            p.y += p.vy; // Floating upward
            p.vx += Math.sin(p.y * 0.015) * 0.01;

            // Zero-G Mouse Repulsion and Dispersion
            if (mouse.x !== null && mouse.y !== null) {
              const dx = p.x - mouse.x;
              const dy = p.y - mouse.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < mouse.radius) {
                const force = (mouse.radius - dist) / mouse.radius;
                const angle = Math.atan2(dy, dx);
                p.x += Math.cos(angle) * force * 3.5;
                p.y += Math.sin(angle) * force * 3.5;
              }
            }

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity * (p.life / p.originalLife);
            ctx.fill();

            p.life--;

            // Respawn from bottom or edge when particle escapes off top (continuous liftoff)
            if (p.life <= 0 || p.y < -15 || p.x < -15 || p.x > canvasWidth + 15 || p.y > canvasHeight + 15) {
              p.x = Math.random() * canvasWidth;
              p.y = canvasHeight + Math.random() * 20;
              p.vx = (Math.random() - 0.5) * 0.6;
              p.vy = -(Math.random() * 0.7 + 0.15);
              p.life = Math.random() * 200 + 100;
              p.opacity = Math.random() * 0.5 + 0.35;
            }
          }

          ctx.globalAlpha = 1.0;
          animationFrameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          resizeObserver.disconnect();
          intersectionObserver.disconnect();
          container.removeEventListener('mousemove', handleMouseMove);
          container.removeEventListener('mouseleave', handleMouseLeave);
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [isDarkMode]);

      return (
        <div ref={containerRef} className="absolute inset-0 w-full h-full z-0 overflow-hidden">
          <canvas ref={canvasRef} className="block w-full h-full" />
        </div>
      );
    };

    // --- GOOGLE ANTIGRAVITY 3D PERSPECTIVE TILT & SPOTLIGHT CARD ---
    const AntigravityTiltCard = ({ children, className = "", staggerClass = "" }) => {
      const cardRef = useRef(null);
      const [tiltStyle, setTiltStyle] = useState({});

                </div>

                <div className="space-y-4 pt-4 border-t border-slate-200 dark:border-zinc-800/80">
                  <h2 className="text-sm font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-blue-500"></span>
                    {profileData.aboutHeadline}
                  </h2>
                  <div className="space-y-3.5 text-xs leading-relaxed text-slate-700 dark:text-zinc-300">
                    {profileData.aboutParagraphs.map((para, idx) => (
                      <p key={idx}>{para}</p>
                    ))}
                  </div>
                </div>
              </AntigravityTiltCard>

              {/* LAYER 02: PROFESSIONAL EXPERIENCE */}
              <AntigravityTiltCard staggerClass="layer-card-2" className="p-6 rounded-2xl border bg-white dark:bg-[#121317]/90 border-slate-200 dark:border-zinc-800/80 shadow-sm dark:shadow-xl backdrop-blur-sm transition-colors">
                <div className="mb-5 border-b border-slate-200 dark:border-zinc-800/80 pb-3">
                  <h3 className="font-bold text-sm uppercase tracking-wider text-slate-700 dark:text-zinc-400">Professional Experience</h3>
                </div>

                <div className="space-y-8">
                  {experienceList.map((exp, idx) => (
                    <div key={idx} className={idx > 0 ? "pt-6 border-t border-slate-200 dark:border-zinc-900" : ""}>
                      <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                        <div className="inline-block bg-slate-900 text-white dark:bg-white dark:text-black border border-slate-900 dark:border-white px-3 py-1 rounded-xl shadow-sm">
                          <h4 className="text-sm font-black tracking-tight">{exp.company}</h4>
                        </div>
                        <span className="text-xs font-mono px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-zinc-900 border border-slate-200 dark:border-zinc-800 text-slate-700 dark:text-zinc-300">
                          {exp.period}
                        </span>
                      </div>
                      
                      <p className="text-xs text-slate-600 dark:text-zinc-400 font-mono mb-3">
                        <span className="font-bold text-slate-800 dark:text-zinc-200">{exp.role}</span> — {exp.location}
                      </p>
                      
                      <ul className="space-y-2.5">
                        {exp.tasks.map((task, tIdx) => {
                          const isMatch = matchesSearch(task) || matchesSearch(exp.company) || matchesSearch(exp.role);
                          return (
                            <li 
                              key={tIdx} 
                              className={`flex items-start text-xs leading-relaxed transition-all duration-300 ${
                                isMatch ? 'text-slate-700 dark:text-zinc-300 opacity-100 translate-x-0' : 'opacity-20 -translate-x-1'
                              }`}
                            >
                              <span className="text-slate-900 dark:text-zinc-100 mr-2 font-bold select-none">•</span>
                              <span>{task}</span>
                            </li>
                          );
                        })}
                      </ul>
                    </div>
                  ))}
                </div>
              </AntigravityTiltCard>

              {/* LAYER 03: CERTIFICATIONS & EDUCATION */}
              <AntigravityTiltCard staggerClass="layer-card-3" className="p-6 rounded-2xl border bg-white dark:bg-[#121317]/90 border-slate-200 dark:border-zinc-800/80 shadow-sm dark:shadow-xl backdrop-blur-sm transition-colors">
                <h3 className="font-bold text-sm uppercase tracking-wider text-slate-700 dark:text-zinc-400 mb-4 pb-2 border-b border-slate-200 dark:border-zinc-800/80">
                  Certifications & Education
                </h3>

                <div className="space-y-4">
                  {educationData.map((edu, idx) => {
                    const isMatch = matchesSearch(edu.title) || matchesSearch(edu.institution) || matchesSearch(edu.credentialId || '');
                    return (
                      <div 
                        key={idx} 
                        className={`flex items-start space-x-3 transition-all duration-300 ${isMatch ? 'opacity-100' : 'opacity-20'}`}
                      >
                        <div className="mt-1">
                          <span className="w-1.5 h-1.5 rounded-full bg-slate-700 dark:bg-zinc-200 block"></span>
                        </div>
                        <div className="flex-1">
                          <div className="flex items-baseline justify-between gap-2 flex-wrap">
                            <div className="flex items-center gap-2 flex-wrap">
                              <h4 className="text-xs font-bold text-slate-900 dark:text-white">{edu.title}</h4>
                              {edu.credentialId && (
                                <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-50 dark:bg-zinc-900 border border-emerald-300 dark:border-zinc-700 text-emerald-700 dark:text-emerald-400 font-semibold tracking-wider flex items-center gap-1">
                                  <span className="w-1 h-1 rounded-full bg-emerald-500"></span>
                                  ID: {edu.credentialId}
                                </span>
                              )}
                            </div>
                            <span className="text-[10px] font-mono text-slate-500 dark:text-zinc-500">{edu.year}</span>
                          </div>
                          <p className="text-[11px] text-slate-600 dark:text-zinc-400 font-mono mt-0.5">{edu.institution} — <span className="italic">{edu.location}</span></p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </AntigravityTiltCard>

            </div>

            {/* RIGHT COLUMN: TECHNICAL SKILLS (CATEGORIZED CV MATRIX), DIAGNOSTICS, CONTACT */}
            <div className="space-y-6">
              
              {/* LAYER 04: TECHNICAL SKILLS */}
              <AntigravityTiltCard staggerClass="layer-card-4" className="p-6 rounded-2xl border bg-white dark:bg-[#121317]/90 border-slate-200 dark:border-zinc-800/80 shadow-sm dark:shadow-xl backdrop-blur-sm transition-colors">
                <div className="flex items-center justify-between mb-4 pb-2 border-b border-slate-200 dark:border-zinc-800/80">
                  <h3 className="font-bold text-sm uppercase tracking-wider text-slate-700 dark:text-zinc-400">
                    Technical Skills
                  </h3>
                </div>

                <div className="space-y-5">
                  {skillCategories.map((cat, cIdx) => (
                    <div key={cIdx}>
                      <h4 className="text-[11px] font-mono uppercase font-bold text-slate-700 dark:text-zinc-400 mb-2 tracking-wider flex items-center gap-1.5">
                        <span className="w-1.5 h-1.5 rounded-full bg-slate-400 dark:bg-zinc-500"></span>
                        {cat.title}
                      </h4>
                      <div className="flex flex-wrap gap-1.5">
                        {cat.skills.map((skill, sIdx) => {
                          const isMatch = matchesSearch(skill) || matchesSearch(cat.title);
                          return (
                            <span
                              key={sIdx}
                              className={`px-2.5 py-1 rounded-md text-[11px] font-mono font-medium border transition-all duration-300 cursor-default ${
                                isMatch 
                                  ? searchQuery 
                                    ? 'bg-emerald-500/10 dark:bg-emerald-500/15 border-emerald-500/60 text-emerald-800 dark:text-emerald-300 shadow-[0_0_12px_rgba(16,185,129,0.2)] font-semibold scale-105'
                                    : 'bg-slate-100 dark:bg-zinc-900 border-slate-300 dark:border-zinc-700 text-slate-800 dark:text-zinc-200 hover:border-slate-500 dark:hover:border-zinc-500 hover:scale-105' 
                                  : 'opacity-20 scale-95'
                              }`}
                            >
                              {skill}
                            </span>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="mt-6 pt-4 border-t border-slate-200 dark:border-zinc-800/80 text-[11px] text-slate-600 dark:text-zinc-400">
                  Languages: <strong className="text-slate-900 dark:text-zinc-200">{languages.join(', ')}</strong>
                </div>
              </AntigravityTiltCard>

              {/* LAYER 05: DIAGNOSTICS & PING CENTER */}
              <AntigravityTiltCard staggerClass="layer-card-5" className="p-6 rounded-2xl border bg-white dark:bg-[#121317]/90 border-slate-200 dark:border-zinc-800/80 shadow-sm dark:shadow-xl backdrop-blur-sm transition-colors">
                <h3 className="font-bold text-sm uppercase tracking-wider text-slate-700 dark:text-zinc-400 mb-4 pb-2 border-b border-slate-200 dark:border-zinc-800/80">
                  Network Latency Diagnostics
                </h3>
                
                <p className="text-xs text-slate-600 dark:text-zinc-400 mb-4 leading-relaxed">
                  Simulate ICMP diagnostics to Amal VA's enterprise gateway node directly from your browser.
                </p>

                <button
                  onClick={runPingDiag}
                  disabled={isPinging}
                  className={`w-full py-2.5 rounded-xl font-bold text-xs uppercase tracking-wider transition-all duration-200 border ${
                    isPinging 
                      ? 'bg-slate-100 dark:bg-zinc-900 text-slate-400 dark:text-zinc-500 border-slate-200 dark:border-zinc-800 cursor-not-allowed' 
                      : 'bg-slate-900 hover:bg-slate-800 text-white border-slate-900 dark:bg-white dark:text-black dark:hover:bg-zinc-200 dark:border-white shadow-sm hover:-translate-y-0.5 active:scale-95'
                  }`}
                >
                  {isPinging ? 'Pinging Node...' : 'Ping amalva.in'}
                </button>

                {pingResult && (
                  <pre className="mt-4 p-4 rounded-xl bg-slate-950 text-emerald-400 border border-slate-800 dark:border-zinc-800 font-mono text-[10px] leading-relaxed overflow-x-auto whitespace-pre-wrap max-h-36 shadow-inner animate-slide-up">
                    {pingResult}
                  </pre>
                )}
              </AntigravityTiltCard>

              {/* LAYER 06: CONTACT */}
              <AntigravityTiltCard staggerClass="layer-card-6" className="p-6 rounded-2xl border bg-white dark:bg-[#121317]/90 border-slate-200 dark:border-zinc-800/80 shadow-sm dark:shadow-xl backdrop-blur-sm transition-colors">
                <h3 className="font-bold text-sm uppercase tracking-wider text-slate-700 dark:text-zinc-400 mb-4 pb-2 border-b border-slate-200 dark:border-zinc-800/80">
                  Get in Touch
                </h3>

                <form onSubmit={handleContactSubmit} className="space-y-4">
                  <div className="space-y-3">
                    <div>
                      <label className="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-zinc-400 mb-1">Your Name</label>
                      <input
                        type="text"
                        required
                        value={formInput.name}
                        onChange={(e) => setFormInput({ ...formInput, name: e.target.value })}
                        placeholder="Your Name"
                        className="w-full px-3 py-2 text-xs rounded-lg border bg-slate-50 dark:bg-zinc-900/90 border-slate-300 dark:border-zinc-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 dark:focus:border-emerald-500 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none transition-all duration-200"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-zinc-400 mb-1">Email</label>
                      <input
                        type="email"
                        required
                        value={formInput.email}
                        onChange={(e) => setFormInput({ ...formInput, email: e.target.value })}
                        placeholder="your.email@example.com"
                        className="w-full px-3 py-2 text-xs rounded-lg border bg-slate-50 dark:bg-zinc-900/90 border-slate-300 dark:border-zinc-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 dark:focus:border-emerald-500 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none transition-all duration-200"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-zinc-400 mb-1">Message</label>
                    <textarea
                      rows="3"
                      required
                      value={formInput.message}
                      onChange={(e) => setFormInput({ ...formInput, message: e.target.value })}
                      placeholder="Discuss network engineering placement, routing/switching projects, or rack setup..."
                      className="w-full px-3 py-2 text-xs rounded-lg border bg-slate-50 dark:bg-zinc-900/90 border-slate-300 dark:border-zinc-800 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 dark:focus:border-emerald-500 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none transition-all duration-200"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white dark:bg-white dark:hover:bg-zinc-200 dark:text-black font-bold text-xs uppercase tracking-wider transition-all duration-200 hover:-translate-y-0.5 active:scale-95 shadow-sm hover:shadow-lg"
                  >
                    Send Message
                  </button>
                </form>
              </AntigravityTiltCard>

            </div>

          </main>

          {/* FOOTER */}
          <footer className="border-t py-10 mt-12 bg-white dark:bg-[#121317] border-slate-200 dark:border-zinc-900 text-slate-600 dark:text-zinc-500 transition-colors layer-card-footer">
            <div className="max-w-4xl mx-auto px-4 text-center space-y-2">
              <p className="text-xs font-medium text-slate-700 dark:text-zinc-400">Thrissur, Kerala, India</p>
              <p className="text-xs text-slate-500 dark:text-zinc-600">
                &copy; {new Date().getFullYear()} Amal V A. All rights reserved.
              </p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
